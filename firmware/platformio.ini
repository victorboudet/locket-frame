[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; CH343 bridge (the UART USB-C port) by stable id — Serial output only appears
; here. With both USB-C ports attached, /dev/ttyACM0 can be grabbed by the
; Espressif USB-JTAG port instead, which stays silent.
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B91048417-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B91048417-if00
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -Iinclude                     ; expose config.h to lib/waveshare_epd/ too
board_build.arduino.memory_type = qio_opi   ; QIO flash + OPI PSRAM for the N16R8 part
board_build.flash_size = 16MB
board_upload.flash_size = 16MB              ; esptool's --flash_size; without this PIO defaults to the board JSON's 8MB
board_upload.maximum_size = 16777216        ; 16 MB upper bound for the upload payload check
board_build.partitions = default_16MB.csv
lib_deps =
    bblanchon/ArduinoJson@^7
    bitbank2/JPEGDEC
